name: Native 3D Android

on:
  push:
    branches: [main]
    paths: ['client/**', 'backend/**', 'tools/assets/**', '.github/workflows/android-build.yml']
  pull_request:
    paths: ['client/**', 'backend/**', 'tools/assets/**', '.github/workflows/android-build.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: prime
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: prime_native
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U prime -d prime_native"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/assets/package-lock.json
      - name: Restore pinned CC0 humans and photographic PBR assets
        run: npm ci --prefix tools/assets --ignore-scripts && npm run --prefix tools/assets prepare:models
      - name: Install animation capture encoder
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -version
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install verified Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cd "$RUNNER_TEMP/godot"
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o engine.zip
          curl -fL --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o templates.tpz
          echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum --check
          echo 'ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079  templates.tpz' | sha512sum --check
          unzip -q engine.zip
          unzip -q templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
      - name: Configure Android tools and signing
        shell: bash
        env:
          PRIME_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PRIME_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PRIME_RELEASE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.1'
          mkdir -p "$HOME/.config/godot" client/builds
          keytool -genkeypair -keystore "$RUNNER_TEMP/prime-debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$RUNNER_TEMP/prime-debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS
          python3 - <<'PY'
          import os, base64, pathlib
          if os.environ.get('PRIME_RELEASE_KEYSTORE'):
              if not os.environ.get('PRIME_RELEASE_PASSWORD') or not os.environ.get('PRIME_RELEASE_ALIAS'):
                  raise SystemExit('Release signing requires all three repository secrets')
              key = pathlib.Path(os.environ['RUNNER_TEMP']) / 'prime-release.keystore'
              key.write_bytes(base64.b64decode(os.environ['PRIME_RELEASE_KEYSTORE'], validate=True))
              key.chmod(0o600)
              values = {
                  'PRIME_EXPORT_MODE': 'release',
                  'GODOT_ANDROID_KEYSTORE_RELEASE_PATH': str(key),
                  'GODOT_ANDROID_KEYSTORE_RELEASE_USER': os.environ['PRIME_RELEASE_ALIAS'],
                  'GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD': os.environ['PRIME_RELEASE_PASSWORD'],
              }
          else:
              values = {'PRIME_EXPORT_MODE': 'debug'}
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name, value in values.items():
                  if '\n' in value or '\r' in value: raise SystemExit('Signing values cannot contain newlines')
                  output.write(f'{name}={value}\n')
          PY
      - name: Import all real 3D assets and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path client --editor --import 2>&1 | tee client/builds/import.log
          if grep -E 'SCRIPT ERROR|ERROR:' client/builds/import.log; then exit 1; fi
      - name: Native account entry, shared map and persistent village contract
        shell: bash
        env:
          DATABASE_URL: postgresql://prime:ci-only-password@127.0.0.1:5432/prime_native
          PORT: '3100'
          PRIME_TEST_API_URL: http://127.0.0.1:3100
        run: |
          set -euo pipefail
          npm ci --prefix backend --ignore-scripts
          node backend/src/main.js > client/builds/api-contract-server.log 2>&1 &
          prime_api_pid=$!
          trap 'kill "$prime_api_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import urllib.request, time
          for attempt in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:3100/ready', timeout=1)
                  break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit('Disposable test API did not become ready')
          PY
          Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/network.gd -- --smoke 2>&1 | tee client/builds/account-contract.log
          if grep -E 'SCRIPT ERROR|ERROR:' client/builds/account-contract.log; then exit 1; fi
      - name: Reconnect, Android lifecycle and bounded NPC regression checks
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/resilience.gd -- --smoke 2>&1 | tee client/builds/resilience.log
          if grep -E 'SCRIPT ERROR|ERROR:' client/builds/resilience.log; then exit 1; fi
      - name: Exercise native 3D physics, animations and rendered village
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' Godot_v4.7.2-stable_linux.x86_64 --path client --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/smoke.gd -- --smoke --screenshot 2>&1 | tee client/builds/smoke.log
          if grep -E 'SCRIPT ERROR|ERROR:' client/builds/smoke.log; then exit 1; fi
          xvfb-run -a -s '-screen 0 1280x720x24' Godot_v4.7.2-stable_linux.x86_64 --path client --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/presentation.gd -- --smoke 2>&1 | tee client/builds/presentation.log
          if grep -E 'SCRIPT ERROR|ERROR:' client/builds/presentation.log; then exit 1; fi
          Godot_v4.7.2-stable_linux.x86_64 --headless --path client --fixed-fps 60 --script res://tests/actions.gd -- --smoke 2>&1 | tee client/builds/actions.log
          if grep -E 'SCRIPT ERROR|ERROR:' client/builds/actions.log; then exit 1; fi
          xvfb-run -a -s '-screen 0 1280x720x24' Godot_v4.7.2-stable_linux.x86_64 --path client --audio-driver Dummy --rendering-method gl_compatibility --script res://tests/poses.gd -- --smoke 2>&1 | tee client/builds/poses.log
          if grep -E 'SCRIPT ERROR|ERROR:' client/builds/poses.log; then exit 1; fi
      - name: Validate anatomical rig and all three scenery budgets
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path client --script res://tests/visuals.gd -- --smoke 2>&1 | tee client/builds/visuals.log
          if grep -E 'SCRIPT ERROR|ERROR:' client/builds/visuals.log; then exit 1; fi
      - name: Validate physical sword draw, finger rig and actual player images
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path client --fixed-fps 60 --script res://tests/hero.gd -- --smoke 2>&1 | tee client/builds/hero-headless.log
          if grep -E 'SCRIPT ERROR|ERROR:' client/builds/hero-headless.log; then exit 1; fi
          xvfb-run -a -s '-screen 0 1280x720x24' Godot_v4.7.2-stable_linux.x86_64 --path client --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 30 --script res://tests/hero.gd -- --smoke 2>&1 | tee client/builds/hero-render.log
          if grep -E 'SCRIPT ERROR|ERROR:' client/builds/hero-render.log; then exit 1; fi
      - name: Record actual controller movement with LOW software rendering
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' Godot_v4.7.2-stable_linux.x86_64 --path client --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 30 --script res://tests/film.gd -- --smoke 2>&1 | tee client/builds/film.log
          if grep -E 'SCRIPT ERROR|ERROR:' client/builds/film.log; then exit 1; fi
          ffmpeg -y -framerate 30 -i client/builds/frames/frame-%04d.png -c:v libx264 -threads 4 -crf 21 -pix_fmt yuv420p -movflags +faststart client/builds/animation.mp4
      - name: Export and verify installable Android APK
        shell: bash
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --path client --export-"$PRIME_EXPORT_MODE" Android builds/PRIME-KINGDOMS-0.6.apk 2>&1 | tee client/builds/export.log
          if grep -E 'SCRIPT ERROR|ERROR:' client/builds/export.log; then exit 1; fi
          test -s client/builds/PRIME-KINGDOMS-0.6.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose client/builds/PRIME-KINGDOMS-0.6.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging client/builds/PRIME-KINGDOMS-0.6.apk > client/builds/apk-metadata.log
          sed -n '1,15p' client/builds/apk-metadata.log
          (cd client/builds && sha256sum PRIME-KINGDOMS-0.6.apk village.png human.png sword.png prone.png horse.png units.png animation.mp4 login.png settings.png atlas.png hero-front.png hero-back.png hero-face.png hero-draw-21.png hero-draw-45.png hero-draw-65.png hero-sword.png ground-detail.png > SHA256SUMS.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PRIME-KINGDOMS-Android-0.6
          path: |
            client/builds/PRIME-KINGDOMS-0.6.apk
            client/builds/SHA256SUMS.txt
            client/builds/village.png
            client/builds/human.png
            client/builds/sword.png
            client/builds/prone.png
            client/builds/horse.png
            client/builds/units.png
            client/builds/animation.mp4
            client/builds/login.png
            client/builds/settings.png
            client/builds/atlas.png
            client/builds/hero-front.png
            client/builds/hero-back.png
            client/builds/hero-face.png
            client/builds/hero-draw-21.png
            client/builds/hero-draw-45.png
            client/builds/hero-draw-65.png
            client/builds/hero-sword.png
            client/builds/ground-detail.png
          if-no-files-found: error
          retention-days: 30
      - name: Save separately downloadable runtime images and movie
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PRIME-KINGDOMS-0.6-evidence
          path: |
            client/builds/hero-front.png
            client/builds/hero-back.png
            client/builds/hero-face.png
            client/builds/hero-draw-21.png
            client/builds/hero-draw-45.png
            client/builds/hero-draw-65.png
            client/builds/hero-sword.png
            client/builds/ground-detail.png
            client/builds/animation.mp4
            client/builds/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish verified Android milestone
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.6.0 >/dev/null 2>&1; then
            prime_released_head=$(gh release view v0.6.0 --json targetCommitish --jq .targetCommitish)
            if test "$prime_released_head" = "$GITHUB_SHA"; then
              echo 'The release for this exact source commit is already published; existing downloads stay unchanged.'
            else
              git fetch --depth=1 origin "$prime_released_head"
              git diff --exit-code "$prime_released_head" "$GITHUB_SHA" -- client/project.godot client/export_presets.cfg client/scripts client/shaders client/assets tools/assets
              echo 'Server-only patch verified. Installed clients receive the API fix; the existing APK release stays unchanged.'
            fi
          else
            gh release create v0.6.0 client/builds/PRIME-KINGDOMS-0.6.apk client/builds/village.png client/builds/human.png client/builds/sword.png client/builds/prone.png client/builds/horse.png client/builds/units.png client/builds/animation.mp4 client/builds/login.png client/builds/settings.png client/builds/atlas.png client/builds/hero-front.png client/builds/hero-back.png client/builds/hero-face.png client/builds/hero-draw-21.png client/builds/hero-draw-45.png client/builds/hero-draw-65.png client/builds/hero-sword.png client/builds/ground-detail.png client/builds/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --title 'PRIME KINGDOMS 0.6 — Player regalia, physical sword and stone ground' --notes-file docs/RELEASE_0_6.md
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Native-3D-validation-logs
          path: client/builds/*.log
          retention-days: 7
