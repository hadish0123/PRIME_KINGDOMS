name: Import PRIME Town Stage 2

on:
  push:
    branches:
      - feature/production-strategy-polish
    paths:
      - .github/workflows/import-prime-town-stage2.yml

permissions:
  contents: write

jobs:
  import-town:
    if: contains(github.event.head_commit.message, 'Stage PRIME town asset import')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-strategy-polish
          fetch-depth: 0
      - name: Download PRIME Blender Town assets
        shell: bash
        run: |
          set -euo pipefail
          target="client/assets/models/environment"
          mkdir -p "$target"
          curl -fL --retry 4 --retry-delay 2 'https://prime-blender-production-production.up.railway.app/files/bC4yFigSBDQ08yfhSeT172ZhGK4hY0RtZVoYgUiB7ZU' -o "$target/prime_town_stage2.glb"
          curl -fL --retry 4 --retry-delay 2 'https://prime-blender-production-production.up.railway.app/files/hVWYoSuM7FGPkXcBSVgWaVzOdgMDXhhxJa9mnZoqFjw' -o "$target/prime_town_stage2.metadata.json"
          curl -fL --retry 4 --retry-delay 2 'https://prime-blender-production-production.up.railway.app/files/Iii3Uxikr4-nJRbvnViJRvgOZUir-P886Y0kfQWE750' -o "$target/prime_town_stage2.gd"
          curl -fL --retry 4 --retry-delay 2 'https://prime-blender-production-production.up.railway.app/files/CZa58_rIxWL-Uyb6iKXBLD1wPlZsfHStqSuPns_L6w4' -o "$target/prime_town_stage2.tscn"
          test -s "$target/prime_town_stage2.glb"
          test -s "$target/prime_town_stage2.metadata.json"
          echo "Town GLB bytes: $(stat -c%s "$target/prime_town_stage2.glb")"
      - name: Commit Town assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PRIME Blender Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f client/assets/models/environment/prime_town_stage2.*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import PRIME Blender town stage 2 assets"
          git push origin HEAD:feature/production-strategy-polish
