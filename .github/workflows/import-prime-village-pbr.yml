name: Import PRIME Village PBR

on:
  push:
    branches:
      - feature/production-strategy-polish
    paths:
      - .github/workflows/import-prime-village-pbr.yml

permissions:
  contents: write

jobs:
  import-pbr:
    if: contains(github.event.head_commit.message, 'Stage PRIME village PBR import')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-strategy-polish
          fetch-depth: 0
      - name: Replace village GLB with baked PBR version
        shell: bash
        run: |
          set -euo pipefail
          target="client/assets/models/environment/prime_village_stage1.glb"
          curl -fL --retry 4 --retry-delay 2 'https://prime-blender-production-production.up.railway.app/files/1tquCGYTCz6EUSC2F8u7kwzHgay3HNf4KPLL3nuHLQE' -o "$target"
          test -s "$target"
          echo "PBR GLB bytes: $(stat -c%s "$target")"
      - name: Commit baked PBR asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PRIME Blender Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f client/assets/models/environment/prime_village_stage1.glb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Upgrade village stage 1 to baked PBR asset"
          git push origin HEAD:feature/production-strategy-polish
