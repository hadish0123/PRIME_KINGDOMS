name: Import PRIME Village Assets

on:
  push:
    branches:
      - feature/production-strategy-polish
    paths:
      - .github/workflows/import-prime-village-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    if: contains(github.event.head_commit.message, 'Stage PRIME village asset import')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: feature/production-strategy-polish
          fetch-depth: 0

      - name: Download PRIME Blender Godot assets
        shell: bash
        run: |
          set -euo pipefail
          target="client/assets/models/environment"
          mkdir -p "$target"
          curl -fL --retry 4 --retry-delay 2 'https://prime-blender-production-production.up.railway.app/files/NXyVtFEGUvTCvKsvZj6FbSNNsg7-ftotfCatro7j2qk' -o "$target/prime_village_stage1.glb"
          curl -fL --retry 4 --retry-delay 2 'https://prime-blender-production-production.up.railway.app/files/XML0YaGyfPzNdfWAZvMfCr9j6rzsq06Gp_j4kY3DePc' -o "$target/prime_village_stage1.metadata.json"
          curl -fL --retry 4 --retry-delay 2 'https://prime-blender-production-production.up.railway.app/files/4VK9hqx_V7B3o-NlEedcUKntfub1MPiejUWUJV2RqwY' -o "$target/prime_village_stage1.gd"
          curl -fL --retry 4 --retry-delay 2 'https://prime-blender-production-production.up.railway.app/files/-qmRDeqlyHzkzTT3LY1oAriUucUKOwmmgL5NZj1zCXM' -o "$target/prime_village_stage1.tscn"
          test -s "$target/prime_village_stage1.glb"
          test -s "$target/prime_village_stage1.metadata.json"
          echo "GLB bytes: $(stat -c%s "$target/prime_village_stage1.glb")"

      - name: Commit imported assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PRIME Blender Bot"
          git config user.email "actions@users.noreply.github.com"
          git add client/assets/models/environment/prime_village_stage1.*
          if git diff --cached --quiet; then
            echo "Assets already current."
            exit 0
          fi
          git commit -m "Import PRIME Blender village stage 1 assets"
          git push origin HEAD:feature/production-strategy-polish
