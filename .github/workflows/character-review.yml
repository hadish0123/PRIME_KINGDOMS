name: Player character review

on:
  pull_request:
    paths: ['client/scripts/hero*', 'client/scripts/actor.gd', 'client/shaders/hero*', 'client/tests/character_review.gd', 'tools/assets/humans.py', 'tools/assets/hero_sculpt.py', 'tools/assets/character_assets.py', 'tools/assets/sources.json', '.github/workflows/character-review.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: character-${{ github.ref }}
  cancel-in-progress: true

jobs:
  character:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Restore checksum-pinned character assets
        run: python3 tools/assets/character_assets.py
      - name: Install rendering and capture tools
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends xvfb xauth ffmpeg
      - name: Restore verified Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/character-godot" client/builds
          cd "$RUNNER_TEMP/character-godot"
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o engine.zip
          echo '9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65  engine.zip' | sha512sum --check
          unzip -q engine.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          echo "$RUNNER_TEMP/character-godot" >> "$GITHUB_PATH"
      - name: Import and render the actual production player
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path client --import 2>&1 | tee client/builds/character-import.log
          if grep -E 'SCRIPT ERROR|ERROR:' client/builds/character-import.log; then exit 1; fi
          xvfb-run -a -s '-screen 0 1280x720x24' Godot_v4.7.2-stable_linux.x86_64 --path client --audio-driver Dummy --rendering-method gl_compatibility --fixed-fps 30 --script res://tests/character_review.gd -- --record 2>&1 | tee client/builds/character-review.log
          if grep -E 'SCRIPT ERROR|ERROR:' client/builds/character-review.log; then exit 1; fi
          ffmpeg -y -framerate 30 -i client/builds/character-frames/%04d.png -c:v libx264 -threads 4 -crf 19 -pix_fmt yuv420p -movflags +faststart client/builds/character-review.mp4
          cd client/builds
          sha256sum character-front.png character-face.png character-profile.png character-back.png character-sword.png character-review.mp4 > CHARACTER-SHA256SUMS.txt
      - name: Upload actual character evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: PRIME-character-review-${{ github.sha }}
          path: |
            client/builds/character-*.png
            client/builds/character-review.mp4
            client/builds/character-import.log
            client/builds/character-review.log
            client/builds/CHARACTER-SHA256SUMS.txt
          retention-days: 30
